name: Refresh profile cards

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
      - 'profile/**'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: mahinigam
          cards: overview,contributions,rhythm,languages
          output-dir: assets/profile
          themes: light,dark
          commit: true
          commit-message: 'chore(profile): refresh generated cards [skip ci]'
