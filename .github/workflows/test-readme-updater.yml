name: Profile README updater tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-readme-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile updater
        run: python -m py_compile scripts/update_readme.py

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
